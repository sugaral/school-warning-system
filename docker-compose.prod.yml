services:
  mysql:
    image: mysql:8.0.36
    container_name: warnsys-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-warnsys}
      MYSQL_USER: ${MYSQL_USER:-warnuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    container_name: warnsys-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1000
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: warnsys-minio
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9100}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:4.8.1
    container_name: warnsys-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    depends_on:
      - mysql

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-warnsys-files}
      WARNING_QUEUE_SNAPSHOT_BUCKET: ${WARNING_QUEUE_SNAPSHOT_BUCKET:-warnsys-warning-queue}
      WARNING_QUEUE_DLQ_BUCKET: ${WARNING_QUEUE_DLQ_BUCKET:-warnsys-warning-dlq}
    entrypoint: ["/bin/sh", "-ec"]
    command: >
      until /usr/bin/mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/"$MINIO_BUCKET";
      /usr/bin/mc mb --ignore-existing local/"$WARNING_QUEUE_SNAPSHOT_BUCKET";
      /usr/bin/mc mb --ignore-existing local/"$WARNING_QUEUE_DLQ_BUCKET";

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      target: builder
    depends_on:
      - mysql
      - redis
      - minio
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NODE_ENV: production
      # 容器内部一律走 compose 服务名；根目录 .env 里放的是宿主机/本地开发用的地址
      DATABASE_URL: mysql://${MYSQL_USER:-warnuser}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-warnsys}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-warnsys-files}
      WARNING_QUEUE_SNAPSHOT_BUCKET: ${WARNING_QUEUE_SNAPSHOT_BUCKET:-warnsys-warning-queue}
      WARNING_QUEUE_DLQ_BUCKET: ${WARNING_QUEUE_DLQ_BUCKET:-warnsys-warning-dlq}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      WEB_URL: ${WEB_URL}
      APP_URL: ${APP_URL}
      VITE_ADMIN_APP_URL: ${VITE_ADMIN_APP_URL}
      WECHAT_MINIAPP_APP_ID: ${WECHAT_MINIAPP_APP_ID}
      WECHAT_MINIAPP_APP_SECRET: ${WECHAT_MINIAPP_APP_SECRET}
      WX_APP_ID: ${WX_APP_ID}
      WX_APP_SECRET: ${WX_APP_SECRET}
    entrypoint: ["/bin/sh", "-ec"]
    command: >
      set -e;
      npx prisma migrate deploy || npx prisma db push
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      target: runtime
    container_name: warnsys-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NODE_ENV: production
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-8}
      PORT: 3000
      # 容器内部一律走 compose 服务名；根目录 .env 里放的是宿主机/本地开发用的地址
      DATABASE_URL: mysql://${MYSQL_USER:-warnuser}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-warnsys}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-warnsys-files}
      WARNING_QUEUE_SNAPSHOT_BUCKET: ${WARNING_QUEUE_SNAPSHOT_BUCKET:-warnsys-warning-queue}
      WARNING_QUEUE_DLQ_BUCKET: ${WARNING_QUEUE_DLQ_BUCKET:-warnsys-warning-dlq}
      NOTIFICATION_DISPATCH_ENABLED: ${NOTIFICATION_DISPATCH_ENABLED_API:-false}
      WARNING_QUEUE_CONSUMER_ENABLED: ${WARNING_QUEUE_CONSUMER_ENABLED_API:-false}
      ATTENDANCE_SCHEDULER_ENABLED: ${ATTENDANCE_SCHEDULER_ENABLED_API:-false}
      ATTENDANCE_AUTO_CLOSE_ENABLED: ${ATTENDANCE_AUTO_CLOSE_ENABLED_API:-false}
      WARNING_QUEUE_PENDING_TTL_SECONDS: ${WARNING_QUEUE_PENDING_TTL_SECONDS:-900}
      WARNING_QUEUE_RETRY_LIMIT: ${WARNING_QUEUE_RETRY_LIMIT:-5}
      WARNING_QUEUE_READ_COUNT: ${WARNING_QUEUE_READ_COUNT:-10}
      WARNING_QUEUE_CONSUMER_CONCURRENCY: ${WARNING_QUEUE_CONSUMER_CONCURRENCY:-4}
      WARNING_QUEUE_READ_BLOCK_MS: ${WARNING_QUEUE_READ_BLOCK_MS:-5000}
      WARNING_QUEUE_VISIBILITY_TIMEOUT_MS: ${WARNING_QUEUE_VISIBILITY_TIMEOUT_MS:-30000}
      WARNING_QUEUE_INLINE_MAX_ITEMS: ${WARNING_QUEUE_INLINE_MAX_ITEMS:-30}
      WARNING_QUEUE_INLINE_MAX_BYTES: ${WARNING_QUEUE_INLINE_MAX_BYTES:-8192}
      WARNING_QUEUE_STREAM_MAXLEN: ${WARNING_QUEUE_STREAM_MAXLEN:-10000}
      WARNING_QUEUE_DLQ_STREAM_MAXLEN: ${WARNING_QUEUE_DLQ_STREAM_MAXLEN:-2000}
      WARNING_RECALC_CONCURRENCY: ${WARNING_RECALC_CONCURRENCY:-12}
      WARNING_SYNC_RECALC_CONCURRENCY: ${WARNING_SYNC_RECALC_CONCURRENCY:-12}
      WARNING_STUDENT_LOCK_TTL_MS: ${WARNING_STUDENT_LOCK_TTL_MS:-120000}
      WARNING_TRANSACTION_TIMEOUT_MS: ${WARNING_TRANSACTION_TIMEOUT_MS:-30000}
      WARNING_TRANSACTION_MAX_WAIT_MS: ${WARNING_TRANSACTION_MAX_WAIT_MS:-10000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      WEB_URL: ${WEB_URL}
      APP_URL: ${APP_URL}
      VITE_ADMIN_APP_URL: ${VITE_ADMIN_APP_URL}
      WECHAT_MINIAPP_APP_ID: ${WECHAT_MINIAPP_APP_ID}
      WECHAT_MINIAPP_APP_SECRET: ${WECHAT_MINIAPP_APP_SECRET}
      WX_APP_ID: ${WX_APP_ID}
      WX_APP_SECRET: ${WX_APP_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      target: runtime
    image: warnsys-backend-worker:latest
    container_name: warnsys-worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NODE_ENV: production
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-8}
      # 容器内部一律走 compose 服务名；根目录 .env 里放的是宿主机/本地开发用的地址
      DATABASE_URL: mysql://${MYSQL_USER:-warnuser}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-warnsys}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-warnsys-files}
      WARNING_QUEUE_SNAPSHOT_BUCKET: ${WARNING_QUEUE_SNAPSHOT_BUCKET:-warnsys-warning-queue}
      WARNING_QUEUE_DLQ_BUCKET: ${WARNING_QUEUE_DLQ_BUCKET:-warnsys-warning-dlq}
      NOTIFICATION_DISPATCH_ENABLED: ${NOTIFICATION_DISPATCH_ENABLED_WORKER:-true}
      WARNING_QUEUE_CONSUMER_ENABLED: ${WARNING_QUEUE_CONSUMER_ENABLED_WORKER:-true}
      ATTENDANCE_SCHEDULER_ENABLED: ${ATTENDANCE_SCHEDULER_ENABLED_WORKER:-true}
      ATTENDANCE_AUTO_CLOSE_ENABLED: ${ATTENDANCE_AUTO_CLOSE_ENABLED_WORKER:-true}
      ATTENDANCE_AUTO_CLOSE_INTERVAL_MS: ${ATTENDANCE_AUTO_CLOSE_INTERVAL_MS:-1000}
      ATTENDANCE_AUTO_CLOSE_BATCH: ${ATTENDANCE_AUTO_CLOSE_BATCH:-200}
      ATTENDANCE_AUTO_CLOSE_CONCURRENCY: ${ATTENDANCE_AUTO_CLOSE_CONCURRENCY:-8}
      WARNING_QUEUE_DLQ_REPLAY_LIMIT: ${WARNING_QUEUE_DLQ_REPLAY_LIMIT:-100}
      WARNING_BASELINE_DATE: "${WARNING_BASELINE_DATE:-}"
      NOTIFICATION_WORKER_INTERVAL_MS: ${NOTIFICATION_WORKER_INTERVAL_MS:-30000}
      WARNING_QUEUE_PENDING_TTL_SECONDS: ${WARNING_QUEUE_PENDING_TTL_SECONDS:-900}
      WARNING_QUEUE_RETRY_LIMIT: ${WARNING_QUEUE_RETRY_LIMIT:-5}
      WARNING_QUEUE_READ_COUNT: ${WARNING_QUEUE_READ_COUNT:-10}
      WARNING_QUEUE_CONSUMER_CONCURRENCY: ${WARNING_QUEUE_CONSUMER_CONCURRENCY:-4}
      WARNING_QUEUE_READ_BLOCK_MS: ${WARNING_QUEUE_READ_BLOCK_MS:-5000}
      WARNING_QUEUE_VISIBILITY_TIMEOUT_MS: ${WARNING_QUEUE_VISIBILITY_TIMEOUT_MS:-30000}
      WARNING_QUEUE_INLINE_MAX_ITEMS: ${WARNING_QUEUE_INLINE_MAX_ITEMS:-30}
      WARNING_QUEUE_INLINE_MAX_BYTES: ${WARNING_QUEUE_INLINE_MAX_BYTES:-8192}
      WARNING_QUEUE_STREAM_MAXLEN: ${WARNING_QUEUE_STREAM_MAXLEN:-10000}
      WARNING_QUEUE_DLQ_STREAM_MAXLEN: ${WARNING_QUEUE_DLQ_STREAM_MAXLEN:-2000}
      WARNING_RECALC_CONCURRENCY: ${WARNING_RECALC_CONCURRENCY:-12}
      WARNING_SYNC_RECALC_CONCURRENCY: ${WARNING_SYNC_RECALC_CONCURRENCY:-12}
      WARNING_STUDENT_LOCK_TTL_MS: ${WARNING_STUDENT_LOCK_TTL_MS:-120000}
      WARNING_TRANSACTION_TIMEOUT_MS: ${WARNING_TRANSACTION_TIMEOUT_MS:-30000}
      WARNING_TRANSACTION_MAX_WAIT_MS: ${WARNING_TRANSACTION_MAX_WAIT_MS:-10000}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: ["node", "dist/worker.js"]

  frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile.prod
    container_name: warnsys-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  mysql-data:
  redis-data:
  minio-data:
