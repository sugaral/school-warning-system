server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # ============================================================
    # 关闭 nginx 的绝对地址重定向
    # ------------------------------------------------------------
    # 问题现象（实测，容器化部署）：
    #   宿主端口映射 8080->80，访问 http://localhost:8080/ 时
    #   nginx 返回 302，但 Location 被补成绝对地址
    #   http://localhost/login（丢掉 :8080），浏览器随后访问 80 端口
    #   → 直接连不上，首页等于打不开。
    # 修复：
    #   absolute_redirect off 让 response 里的 Location 保持为
    #   相对路径 /login，由浏览器按当前 host:port 解析，
    #   宿主端映射到任意端口（8080 / 80 / 443）都能正常跳转。
    # ============================================================
    absolute_redirect off;

    # ============================================================
    # 上游 DNS 动态解析（修复 nginx 缓存旧 IP 导致 502）
    # ------------------------------------------------------------
    # 问题现象（实测）：
    #   backend 容器重启后 IP 由 172.19.0.6 变为 172.19.0.7，
    #   但 nginx 只在**启动时**解析一次 `backend` 并永久缓存，
    #   于是所有 /api/ 请求报 502：
    #     connect() failed (111: Connection refused)
    #     while connecting to upstream, upstream: "http://172.19.0.6:3000/..."
    #   直连 3000 端口却完全正常 —— 典型的"代理挂了、后端没挂"。
    #
    # 修复：
    #   1. 显式声明 Docker 内嵌 DNS（127.0.0.11）
    #   2. 用变量形式 proxy_pass（$upstream），强制 nginx 走 resolver
    #      重新解析，而不是复用启动时缓存的 IP；
    #      valid=10s 表示 10 秒后重新校验，容器重建能被快速感知。
    #   3. 因为变量形式不会再自动拼接 URI，需要用 rewrite 手动处理，
    #      因此为每个 location 显式 rewrite ^/prefix/(.*)$ /$1 break;
    # ============================================================
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $upstream_backend "backend:3000";

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # HTML 一律不缓存：否则浏览器会拿旧 index.html（里面引用旧 hash 的 js/css），
    # 导致改了前端却「看起来完全没生效」。
    location = / {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        return 302 /login;
    }

    # /api/xxx → backend /xxx
    location ^~ /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location ^~ /files/ {
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location ^~ /uploads/ {
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location ^~ /admin/files/ {
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ============================================================
    # 前端路由 vs 后端同名接口前缀（实测缺陷：刷新 /attendance 返回 404）
    # ------------------------------------------------------------
    # 下面那条历史代理规则
    #   location ~ ^/(admin|auth|...|attendance|warnings|students|classes|...)(/|$)
    # 会把 **前端路由** `/attendance` 也转发给 Nest，而后端没有 GET /attendance，
    # 浏览器刷新后拿到的是 {"message":"Cannot GET /attendance","statusCode":404}。
    # 实测影响的路由：/attendance /warnings /schedules /course-classes /students
    #                /classes /teachers /users /orgs /roles /permissions /audit /reports
    #
    # 修复方式：不放「精确路径 → index.html」的 location（那会把 axios 的 /orgs、/audit
    # 也当成页面请求，返回 HTML 导致前端解析失败），改为在下面的正则代理里按
    # Accept 头区分：浏览器导航（text/html）回 index.html，XHR（application/json）走代理。
    # ============================================================


    location ~ ^/(admin|auth|orgs|student|warnings|warning-cases|leave_requests|makeup_requests|appeals|attendance|schedules|jobs|warning-rules|courses|student-admin|teaching-admin|teacher|vice-dean|head-teacher|class-monitor|classes|teachers|students|reports|audit|stats|config|users|course-classes|health|requests|permission|permissions|role|roles|feedback|files)(/|$) {
        # 兜底：浏览器地址栏直接访问（Accept: text/html）说明这是页面导航，
        # 不能打到 API；回 index.html 由前端路由处理。axios 请求是
        # application/json，不会命中这里。
        # 注：if 内只放 rewrite ... last，属于 nginx 官方认可的安全用法。
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
